name: Update dashboard data

# Refreshes data.json once per weekday, after the 11:00 CET NAV cut-off for the
# fund. 10:30 UTC = 11:30 CET (winter) / 12:30 CEST (summer).
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python3 scripts/fetch_data.py

      - name: Commit data.json if it changed
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore(data): refresh fund NAV and headlines"
          git push
